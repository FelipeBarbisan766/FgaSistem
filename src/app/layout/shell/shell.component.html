      <a routerLink="/" class="flex items-center gap-2 text-lg font-semibold">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-primary text-primary-content font-bold">F</span>
        FGA<span class="text-primary">Placa Solar</span>
      </a>
      <nav class="flex items-center gap-1">

        <a routerLink="/clientes" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Clientes</a>
        <a routerLink="/servicos" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Histórico</a>
        <a routerLink="/alertas" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Alertas</a>

    </div>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <router-outlet />
